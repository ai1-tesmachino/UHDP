services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: uhdp
      POSTGRES_USER: uhdp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.cloud}
    volumes:
      - cloud-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uhdp -d uhdp"]
      interval: 5s
      timeout: 5s
      retries: 20

  cloud-api:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.cloud
    environment:
      CLOUD_DATABASE_URL: postgresql://uhdp:${POSTGRES_PASSWORD}@postgres:5432/uhdp
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  cloud-postgres:
